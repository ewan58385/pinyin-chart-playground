# Builds a signed Android App Bundle (.aab) for upload to Google Play. Manual only:
# Actions > "Android release bundle" > Run workflow. See docs/RELEASING.md.
#
# Disabled until it is set up: the job runs only when the repository variable
# ANDROID_RELEASE_ENABLED is "true" (Settings > Secrets and variables > Actions > Variables),
# and needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64     the upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   its store password
#   ANDROID_KEY_ALIAS           the upload key's alias
#   ANDROID_KEY_PASSWORD        the upload key's password
name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Optional Android versionCode override (leave empty to derive it from package.json)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bundle:
    if: ${{ vars.ANDROID_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
      - name: Signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: npm run android:bundle
      - name: Check the bundle is signed
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tee verify.txt
          grep -q "jar verified" verify.txt
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: pinyin-chart-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
