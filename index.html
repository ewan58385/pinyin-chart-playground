<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pinyin Chart</title>
    <meta name="description" content="An interactive Mandarin pinyin chart with native audio, your own recordings and notes." />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pinyin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Appearance before the first paint. This reads a cache of the appearance
      // settings only; the settings themselves live in IndexedDB and rewrite
      // this cache on every load (src/lib/theme.ts).
      (function () {
        try {
          var raw = localStorage.getItem('pinyin-chart-appearance');
          if (!raw) return;
          var c = JSON.parse(raw);
          var pick = c;
          if (c.system) pick = matchMedia('(prefers-color-scheme: dark)').matches ? c.dark : c.light;
          var h = document.documentElement;
          for (var k in pick.attrs) h.setAttribute(k, pick.attrs[k]);
          for (var v in pick.vars) h.style.setProperty(v, pick.vars[v]);
          h.style.colorScheme = pick.attrs['data-theme'];
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Shown until the app replaces it, so the screen is never blank. Styled inline: the stylesheet may not have loaded. -->
      <div style="max-width: 32rem; margin: 0 auto; padding: 48px 20px; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif">
        <p style="margin: 0">Pinyin Chart is starting…</p>
        <p id="boot-slow" hidden style="margin: 12px 0 0">
          This is taking longer than it should.
          <button type="button" onclick="location.reload()" style="margin-left: 6px; min-height: 44px; padding: 0 16px; font: inherit; cursor: pointer">Reload</button>
        </p>
        <p id="boot-webview" hidden style="margin: 12px 0 0">If it still does not open, update Android System WebView from Google Play, then open the app again.</p>
      </div>
    </div>
    <script>
      // If the app has not replaced the notice above after a few seconds, offer a reload.
      setTimeout(function () {
        var slow = document.getElementById('boot-slow');
        if (slow && !document.querySelector('.app')) {
          slow.hidden = false;
          // Inside the Android app the usual cause is an out-of-date system WebView.
          if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) document.getElementById('boot-webview').hidden = false;
        }
      }, 8000);
    </script>
    <noscript>Pinyin Chart needs JavaScript to run. Turn it on in your browser settings, then reload the page.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
